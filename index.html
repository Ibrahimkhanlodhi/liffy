<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liffy</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--fg:#1b1d2a;--mut:#6b7086;--card:#fff;--line:#e3e5ee;--acc:#5b5bf0;--acc2:#8a63f2;--me:#5b5bf0;--mefg:#fff;--bot:#eef0f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--fg:#eceef7;--mut:#8f94ab;--card:#181b25;--line:#272b39;--bot:#222637}}
:root[data-theme="dark"]{--bg:#0f1117;--fg:#eceef7;--mut:#8f94ab;--card:#181b25;--line:#272b39;--bot:#222637}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero{display:flex;flex-direction:column;align-items:center;gap:14px}
.bot{width:132px;height:132px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;box-shadow:0 18px 50px rgba(91,91,240,.35);animation:float 4s ease-in-out infinite;transition:transform .2s}
.bot:hover{transform:scale(1.07)}
.bot:focus-visible{outline:3px solid var(--fg);outline-offset:4px}
.bot svg{width:76px;height:76px}
.eye{animation:blink 5s infinite;transform-origin:center;transform-box:fill-box}
.name{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut)}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));top:calc(16px + env(safe-area-inset-top,0px));width:min(420px,calc(100% - 32px));max-height:640px;margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:none;flex-direction:column;overflow:hidden}
.panel.open{display:flex}
.head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.head .dot{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center}
.head .dot svg{width:20px;height:20px}
.head b{flex:1}
.x{background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer;line-height:1}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:9px 13px;border-radius:16px;line-height:1.45;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--me);color:var(--mefg);border-bottom-right-radius:4px}
.m.b{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.tag{display:block;margin-top:6px;font-size:11px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;color:var(--fg);border-radius:99px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--acc)}
form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:15px}
input:focus{outline:2px solid var(--acc);border-color:transparent}
.send{border:0;border-radius:12px;background:var(--acc);color:#fff;padding:0 16px;font-size:15px;cursor:pointer}
.send:disabled{opacity:.5}

/* ===== cartoon scene + mobile ===== */
:root{--sky1:#7fd0ff;--sky2:#e9f8ff;--hill1:#86e08f;--hill2:#4fc57c;--cloud:#fff;--sun:#ffd84d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#15163f;--sky2:#3d3280;--hill1:#33468a;--hill2:#243166;--cloud:#5a5fa8;--sun:#f4efc4}}
:root[data-theme="dark"]{--sky1:#15163f;--sky2:#3d3280;--hill1:#33468a;--hill2:#243166;--cloud:#5a5fa8;--sun:#f4efc4}
html,body{height:100%}
body{background:linear-gradient(var(--sky1),var(--sky2)) fixed;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.scene{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.sun{position:absolute;top:9%;right:10%;width:clamp(56px,11vw,100px);aspect-ratio:1;border-radius:50%;background:var(--sun);box-shadow:0 0 0 12px rgba(255,255,255,.18),0 0 60px rgba(255,216,77,.55);animation:pulse 5s ease-in-out infinite}
.cloud{position:absolute;left:-220px;width:130px;height:40px;background:var(--cloud);border-radius:40px;opacity:.95;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:56px;height:56px;left:18px;top:-26px}
.cloud::after{width:42px;height:42px;left:62px;top:-18px}
.c1{top:14%;animation-duration:48s}
.c2{top:30%;transform:scale(.7);animation-duration:70s;animation-delay:-30s}
.c3{top:46%;transform:scale(1.2);animation-duration:90s;animation-delay:-55s;opacity:.8}
.hills{position:absolute;left:-5%;bottom:0;width:110%;height:30vh;animation:sway 14s ease-in-out infinite alternate}
.h1{fill:var(--hill1)}.h2{fill:var(--hill2)}
.bub{position:absolute;bottom:-40px;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.6);animation:rise linear infinite}
.hero{position:relative;z-index:1}
.bot{width:clamp(112px,34vw,150px);height:clamp(112px,34vw,150px);border:4px solid #fff;box-shadow:0 10px 0 rgba(0,0,0,.12),0 20px 50px rgba(91,91,240,.4)}
.bot svg{width:58%;height:58%;animation:wiggle 6s ease-in-out infinite}
.name{color:#fff;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.panel{z-index:5}
.msgs{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
input{font-size:16px}
.send,.x{min-height:44px;min-width:44px}
.chip{padding:9px 13px}
@keyframes drift{to{translate:calc(100vw + 440px) 0}}
@keyframes rise{to{transform:translateY(-110vh) translateX(var(--dx,20px));opacity:0}}
@keyframes sway{to{transform:translateX(3%)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes wiggle{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-10deg)}96%{transform:rotate(10deg)}}
@media (max-width:600px){
  .panel{left:0;right:0;top:0;bottom:0;width:100%;max-height:none;margin:0;border:0;border-radius:0;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  :root{padding-top:0;padding-bottom:0}
  .m{max-width:90%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="none"><path class="h1" d="M0 190C240 110 480 250 720 180S1200 240 1440 160V320H0Z"/><path class="h2" d="M0 250C300 200 520 300 800 240S1250 290 1440 230V320H0Z"/></svg>
</div>
<main class="hero">
  <button class="bot" id="open" aria-label="Chat with Liffy">
    <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M32 7v8"/><circle cx="32" cy="6" r="2.5" fill="#fff"/>
      <rect x="10" y="16" width="44" height="34" rx="12"/>
      <path d="M4 30v8M60 30v8"/>
      <ellipse class="eye" cx="23" cy="32" rx="3.5" ry="4.5" fill="#fff" stroke="none"/>
      <ellipse class="eye" cx="41" cy="32" rx="3.5" ry="4.5" fill="#fff" stroke="none"/>
      <path d="M25 42c4 3 10 3 14 0"/>
    </svg>
  </button>
  <div class="name">Liffy</div>
</main>

<section class="panel" id="panel" aria-label="Liffy chat">
  <div class="head"><div class="dot"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><rect x="10" y="16" width="44" height="34" rx="12"/><circle cx="23" cy="32" r="2" fill="#fff"/><circle cx="41" cy="32" r="2" fill="#fff"/></svg></div><b>Liffy</b><button class="x" id="close" aria-label="Close">×</button></div>
  <div class="msgs" id="msgs"></div>
  <div id="cf" style="padding:0 10px"></div><form id="f"><input id="q" placeholder="Ask me anything…" autocomplete="off"><button class="send" id="s">Send</button></form>
</section>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script>
const SITEKEY = "0x4AAAAAAFSCEO4BAgcWupJF"; 
let tsId=null,pending=null;
function verifyHuman(){return new Promise((res,rej)=>{
  pending={res,rej};
  const go=()=>{
    if(!window.turnstile){setTimeout(go,300);return;}
    if(tsId!==null){turnstile.reset(tsId);return;}
    tsId=turnstile.render("#cf",{sitekey:SITEKEY,appearance:"interaction-only",
      callback:async tok=>{try{
        const r=await fetch("/api/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:tok})});
        r.ok?pending.res():pending.rej(new Error("verify"));
      }catch(e){pending.rej(e)}},
      "error-callback":()=>pending.rej(new Error("turnstile"))});
  };go();
});}
const SUGG=["What is the Red Planet?","What is an API?","How does a VPN work?","Who discovered penicillin?"];
const $=id=>document.getElementById(id),msgs=$("msgs"),panel=$("panel"),q=$("q"),s=$("s");
const history=[];
function add(text,cls,tag){const m=document.createElement("div");m.className="m "+cls;m.textContent=text;
 if(tag){const t=document.createElement("span");t.className="tag";t.textContent=tag;m.appendChild(t);}
 msgs.appendChild(m);msgs.scrollTop=msgs.scrollHeight;return m;}
function open(){panel.classList.add("open");q.focus();
 if(!msgs.children.length){add("Hi, I'm Liffy. Ask me about science or tech, or anything else.","b");
  const c=document.createElement("div");c.className="chips";
  SUGG.forEach(t=>{const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=t;b.onclick=()=>{c.remove();ask(t)};c.appendChild(b)});
  msgs.appendChild(c);}}
$("open").onclick=open;$("close").onclick=()=>panel.classList.remove("open");
$("f").onsubmit=e=>{e.preventDefault();const v=q.value.trim();if(v){q.value="";ask(v)}};
async function ask(text){
 add(text,"u");s.disabled=true;const m=add("Thinking...","b");
 try{
  const post=()=>fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,history:history.slice(-6)})});
  let r=await post(),d=await r.json();
  if(r.status===401&&d.needVerify){m.textContent="Quick security check...";await verifyHuman();r=await post();d=await r.json();}
  m.textContent=d.answer;
  if(!r.ok){s.disabled=false;return;}
  const t=document.createElement("span");t.className="tag";t.textContent="Source: "+d.source;m.appendChild(t);
  history.push({role:"user",content:text},{role:"assistant",content:d.answer});
 }catch(e){m.textContent="Sorry, I could not reach the server."}
 s.disabled=false;q.focus();}

(function(){const sc=document.querySelector(".scene");
 for(let i=0;i<14;i++){const b=document.createElement("span");b.className="bub";const s=8+Math.random()*26;
  b.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;--dx:${(Math.random()*60-30).toFixed(0)}px;animation-duration:${10+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;
  sc.appendChild(b);}
 if(window.visualViewport){const vv=visualViewport;
  const fit=()=>{if(innerWidth<=600&&panel.classList.contains("open")){panel.style.height=vv.height+"px";panel.style.top=vv.offsetTop+"px";}else{panel.style.height="";panel.style.top="";}};
  vv.addEventListener("resize",fit);vv.addEventListener("scroll",fit);$("open").addEventListener("click",()=>setTimeout(fit,50));}
})();
</script>
</body>
</html>
